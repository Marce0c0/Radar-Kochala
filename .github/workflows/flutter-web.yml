name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - feature/supabase-fixes-and-ui
      - main
      - master

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create env.txt
        env:
          MY_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MY_SUPABASE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          MY_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "SUPABASE_URL=$MY_SUPABASE_URL" >> env.txt
          echo "SUPABASE_ANON_KEY=$MY_SUPABASE_ANON" >> env.txt
          echo "GEMINI_API_KEY=$MY_GEMINI_KEY" >> env.txt

      - name: Build Web Application
        run: flutter build web --release --base-href="/Radar-Kochala/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
