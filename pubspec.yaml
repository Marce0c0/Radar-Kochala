name: cochabamba_reporta
description: Reportes ciudadanos de problemas urbanos en Cochabamba.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  provider: ^6.1.5+1
  google_generative_ai: ^0.4.7
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true